name: Source Fix -> Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. DOWNLOAD SOURCE
      # ==========================================================

      - name: Download Source ZIP
        run: |
          set -e

          curl -L --fail --retry 3 \
            -o source.zip \
            'https://github.com/AdityaRoyall955/Private-Repo/releases/download/CHATGPT/JAVA.BASED.SRC.2.2.@Yash_Mod.zip'

          ls -lh source.zip
          unzip -t source.zip


      # ==========================================================
      # 2. EXTRACT SOURCE
      # ==========================================================

      - name: Extract Source
        run: |
          set -e

          rm -rf source
          mkdir source

          unzip -q source.zip -d source

          echo "Source extracted:"
          find source -maxdepth 3 -type f | head -200


      # ==========================================================
      # 3. FIND PROJECT
      # ==========================================================

      - name: Locate Android Project
        run: |
          set -e

          GRADLEW="$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            -name gradlew \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo "Project:"
          echo "$PROJECT_DIR"


      # ==========================================================
      # 4. JAVA 11
      # ==========================================================

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'


      # ==========================================================
      # 5. INSTALL ANDROID SDK MANUALLY
      # ==========================================================

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd /tmp

          echo "Downloading Android command line tools..."

          curl -L --fail --retry 3 \
            -o commandlinetools.zip \
            'https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip'

          unzip -q commandlinetools.zip

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          mv cmdline-tools \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "sdkmanager:"
          sdkmanager --version

          echo "Accepting licenses..."

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing required SDK..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

          echo "Android SDK installation complete."


      # ==========================================================
      # 6. SOURCE FIXER
      # ==========================================================

      - name: Source Fixer - Cleanup
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        SOURCE FIXER START"
          echo "======================================"

          echo "[1] Removing generated files..."

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          echo "[2] Checking Gradle..."

          test -f gradlew
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          chmod +x gradlew

          echo "[3] Checking Manifest..."

          test -f app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse("app/src/main/AndroidManifest.xml")

          print("AndroidManifest.xml: OK")
          PY

          echo "[4] Checking resource XML..."

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = "app/src/main/res"
          errors = []

          for base, dirs, files in os.walk(root):
              for filename in files:
                  if not filename.endswith(".xml"):
                      continue

                  path = os.path.join(base, filename)

                  try:
                      ET.parse(path)
                  except Exception as e:
                      errors.append((path, e))

          if errors:
              print("XML ERRORS:")

              for path, error in errors:
                  print(path)
                  print(error)

              raise SystemExit(1)

          print("All resource XML files: OK")
          PY

          echo "[5] Checking Java files..."

          find app/src -type f -name "*.java" | sort

          echo "[6] Checking launcher..."

          if [ -f app/src/main/AndroidManifest.xml ]; then
            grep -n "android:icon\|android:roundIcon" \
              app/src/main/AndroidManifest.xml || true
          fi

          echo "======================================"
          echo "         SOURCE FIXER END"
          echo "======================================"


      # ==========================================================
      # 7. CHECK ADAPTIVE ICONS
      # ==========================================================

      - name: Source Fixer - Launcher Check
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking adaptive launcher icons..."

          for FILE in \
            app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          do

            if [ -f "$FILE" ]; then
              echo ""
              echo "===== $FILE ====="
              cat "$FILE"
            fi

          done

          echo ""
          echo "Launcher check complete."


      # ==========================================================
      # 8. GRADLE INFORMATION
      # ==========================================================

      - name: Inspect Gradle Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== Gradle Wrapper ====="

          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "===== Root build.gradle ====="

          cat build.gradle

          echo ""
          echo "===== App build.gradle ====="

          cat app/build.gradle


      # ==========================================================
      # 9. GRADLE BUILD
      # ==========================================================

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon


      # ==========================================================
      # 10. FIND APK
      # ==========================================================

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================================
      # 11. UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 12. UPLOAD BUILD REPORTS
      # ==========================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/**/build/reports/**
            ${{ env.PROJECT_DIR }}/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
